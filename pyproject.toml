[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xssguard"
version = "0.1.0"
description = "Rule-based Stored XSS detection and dynamic CSP nonce scaffolding."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
flask = ["Flask>=2.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["xssguard*"]
exclude = ["extension*"]